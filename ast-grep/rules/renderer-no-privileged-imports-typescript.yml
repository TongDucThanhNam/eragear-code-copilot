# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: renderer-no-privileged-imports-typescript
message: Renderer TypeScript must use the preload/contextBridge API instead of importing Electron or Node built-ins.
severity: error
language: TypeScript
files:
  - apps/desktop/src/renderer/**/*.ts
rule:
  any:
    - pattern: import $$$BINDINGS from "$SOURCE"
    - pattern: import "$SOURCE"
    - pattern: export { $$$BINDINGS } from "$SOURCE"
    - pattern: export type { $$$BINDINGS } from "$SOURCE"
    - pattern: export * from "$SOURCE"
    - pattern: export * as $NAME from "$SOURCE"
    - pattern: import("$SOURCE")
constraints:
  SOURCE:
    regex: '^(?:electron(?:/|$)|node:)'
note: Privileged desktop operations belong behind preload IPC with context isolation enabled.
